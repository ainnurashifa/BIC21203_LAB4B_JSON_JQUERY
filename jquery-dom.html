<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare JavaScript and jQuery</title>

    <!-- Include jQuery 4.0.0 -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>
</head>
<body>

    <h1>Question 3 - Compare JavaScript and jQuery</h1>

    <!-- (a) Change text -->
    <div id="myElement">Original Text</div>

    <br>

    <!-- (b) Add CSS class -->
    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <br>

    <!-- (c) Button click -->
    <button id="myButton" type="button">Click me</button>

    <script>
        // (a) Change text using jQuery
        $("#myElement").text("Modified Text");

        // (b) Add CSS class using jQuery
        $("#myDIV").addClass("myStyle");

        // (c) Handle button click using jQuery
        $("#myButton").on("click", function() {
            alert("Button clicked!");
        });
    </script>

</body>
</html>
